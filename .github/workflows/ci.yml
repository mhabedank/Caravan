name: ci

# Documentation changes run nothing here (constitution 4.1.0, Resources & Cost Discipline): CI
# minutes are spent where they verify code. A change that touches code runs everything, including
# every test that reads a document, because those tests live in the suite this job runs.
#
# No document is an exception any more. `README.md`, `docs/try-it.md` and `docs/releases/**` used
# to be, since tests read them — but the exception started the whole matrix, nine jobs and a
# five-minute training run, to check assertions that need no framework. Those checks moved to
# `docs-checks.yml`, which runs them on one Python with no extras and also builds the site with
# every warning an error. Editing a page is now cheaper AND better checked than before.
#
# One check is not in that workflow: executing the try-it guide needs the framework, so it stays
# in the `train` job below. A change to the guide alone therefore does not execute it here; the
# release workflow runs the guide against the published release before announcing it, and any
# change that touches code brings the `train` job back.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!specs/**"
      - "!docs/**"
      - "!**/*.md"
      - "!.specify/**"
  pull_request:
    paths:
      - "**"
      - "!specs/**"
      - "!docs/**"
      - "!**/*.md"
      - "!.specify/**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run ruff check src tests docs/_ext
      - run: uv run ruff format --check src tests docs/_ext

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The current stable minor, the previous one, and 3.13 — which the published
        # floor admits for the train extra's sake, and which Principle XII therefore
        # requires to be tested rather than merely claimed (constitution v2.3.0).
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv python install ${{ matrix.python-version }}
      # No extras here: this job is the one that proves the default installation works on
      # every supported Python. tests/verify and tests/train each need an extra and have
      # their own jobs, on the matrix their extra can actually be installed on.
      # Feature 004 generates C source, and one test compiles it. A test that skips everywhere
      # proves nothing, so this job is the one that owns that check: it fails here if the image
      # ever loses its compiler, rather than skipping quietly and leaving SC-004 unchecked.
      - name: a host C++ compiler is present, because a test needs one
        run: g++ --version
      - run: uv run --python ${{ matrix.python-version }} pytest tests/unit tests/contract tests/integration tests/layering -q

  measure:
    # Reading and running an exported model: the verify extra, which publishes wheels for
    # cp310 through cp314 and no cp315 (checked 2026-10-22). So this matrix is 3.13 and
    # 3.14 — the window the extra has, not the window the project has. Putting it in the
    # `test` matrix above would fail to install on 3.15 before running anything.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv python install ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} --extra verify pytest tests/verify tests/unit tests/contract -q

  train:
    # The only job where a training framework exists. 3.13 only, because that is the
    # extra's window (research R1). It runs the whole suite, since the framework is here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv python install 3.13
      - name: install the project with both extras
        run: |
          uv venv --python 3.13 /tmp/train
          VIRTUAL_ENV=/tmp/train uv pip install -e ".[train,verify]" pytest
      - name: record what each extra weighs
        run: |
          bytes=$(du -sb /tmp/train/lib | cut -f1)
          printf 'train+verify: %d MiB installed, %d packages\n' \
            $(( bytes / 1024 / 1024 )) "$(VIRTUAL_ENV=/tmp/train uv pip list | tail -n +3 | wc -l)"
          uv venv --python 3.14 /tmp/verify-only
          VIRTUAL_ENV=/tmp/verify-only uv pip install -e ".[verify]"
          bytes=$(du -sb /tmp/verify-only/lib | cut -f1)
          printf 'verify alone on 3.14: %d MiB installed, %d packages\n' \
            $(( bytes / 1024 / 1024 )) "$(VIRTUAL_ENV=/tmp/verify-only uv pip list | tail -n +3 | wc -l)"
      - name: the verify extra does not resolve on 3.15, and says so rather than breaking
        run: |
          uv venv --python 3.15 /tmp/no-runtime
          VIRTUAL_ENV=/tmp/no-runtime uv pip install -e .
          if VIRTUAL_ENV=/tmp/no-runtime uv pip list | grep -qi ai-edge-litert; then
            echo "the runtime resolved on 3.15; its window has widened and the marker, the"
            echo "messages and docs/budgets.md all need updating"; exit 1
          fi
          VIRTUAL_ENV=/tmp/no-runtime /tmp/no-runtime/bin/caravan quantize \
            tests/fixtures/manifests/valid/picket-mlp-fixture.yaml || code=$?
          if [ "${code:-0}" != "4" ]; then
            echo "expected exit 4 on a Python with no runtime, got ${code:-0}"; exit 1
          fi
      - name: the whole suite, with both extras present
        run: VIRTUAL_ENV=/tmp/train /tmp/train/bin/python -m pytest tests -q

  clean-environment:
    # Level 3 of the layering rule: install only the default package, with no machine-learning
    # framework anywhere near it, and run the suite there (SC-008).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv python install 3.14
      - run: uv build
      - name: install only the default distribution
        run: |
          uv venv --python 3.14 /tmp/clean
          VIRTUAL_ENV=/tmp/clean uv pip install --no-cache dist/caravan_ml-*.whl pytest packaging
      - name: no framework is present
        run: |
          if VIRTUAL_ENV=/tmp/clean uv pip list | grep -Ei 'tensorflow|torch|^jax|keras|onnx'; then
            echo "a machine-learning framework reached the clean environment"; exit 1
          fi
      - name: the suite passes there
        run: VIRTUAL_ENV=/tmp/clean /tmp/clean/bin/python -m pytest tests -q

  install-budget:
    # Principle V: a budget that is not measured is a warning. Over 30 seconds or 50 MB fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv python install 3.14
      - run: uv build
      - name: measure a cold install
        run: |
          uv venv --python 3.14 /tmp/budget
          start=$(date +%s%3N)
          VIRTUAL_ENV=/tmp/budget uv pip install --no-cache --quiet dist/caravan_ml-*.whl
          ms=$(( $(date +%s%3N) - start ))
          bytes=$(du -sb /tmp/budget/lib | cut -f1)
          mib=$(( bytes / 1024 / 1024 ))
          printf 'cold install: %d.%03ds, %d MiB installed\n' $(( ms / 1000 )) $(( ms % 1000 )) "$mib"
          if [ "$ms" -gt 30000 ]; then echo "over the 30 second budget"; exit 1; fi
          if [ "$mib" -gt 50 ]; then echo "over the 50 MB budget"; exit 1; fi
