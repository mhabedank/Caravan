name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The current stable minor, the previous one, and 3.13 — which the published
        # floor admits for the train extra's sake, and which Principle XII therefore
        # requires to be tested rather than merely claimed (constitution v2.3.0).
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv python install ${{ matrix.python-version }}
      # tests/train is deliberately not listed: every test that needs the training
      # framework lives there, and no framework is installed in this job.
      - run: uv run --python ${{ matrix.python-version }} pytest tests/unit tests/contract tests/integration tests/layering -q

  train:
    # The only job where a training framework exists. 3.13 only, because that is the
    # extra's window (research R1). It runs the whole suite, since the framework is here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv python install 3.13
      - name: install the project with the train extra
        run: |
          uv venv --python 3.13 /tmp/train
          VIRTUAL_ENV=/tmp/train uv pip install -e ".[train]" pytest
      - name: record the extra's weight
        run: |
          bytes=$(du -sb /tmp/train/lib | cut -f1)
          printf 'train extra: %d MiB installed, %d packages\n' \
            $(( bytes / 1024 / 1024 )) "$(VIRTUAL_ENV=/tmp/train uv pip list | tail -n +3 | wc -l)"
      - name: the whole suite, with the framework present
        run: VIRTUAL_ENV=/tmp/train /tmp/train/bin/python -m pytest tests -q

  clean-environment:
    # Level 3 of the layering rule: install only the default package, with no machine-learning
    # framework anywhere near it, and run the suite there (SC-008).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv python install 3.14
      - run: uv build
      - name: install only the default distribution
        run: |
          uv venv --python 3.14 /tmp/clean
          VIRTUAL_ENV=/tmp/clean uv pip install --no-cache dist/caravan_ml-*.whl pytest packaging
      - name: no framework is present
        run: |
          if VIRTUAL_ENV=/tmp/clean uv pip list | grep -Ei 'tensorflow|torch|^jax|keras|onnx'; then
            echo "a machine-learning framework reached the clean environment"; exit 1
          fi
      - name: the suite passes there
        run: VIRTUAL_ENV=/tmp/clean /tmp/clean/bin/python -m pytest tests -q

  install-budget:
    # Principle V: a budget that is not measured is a warning. Over 30 seconds or 50 MB fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv python install 3.14
      - run: uv build
      - name: measure a cold install
        run: |
          uv venv --python 3.14 /tmp/budget
          start=$(date +%s%3N)
          VIRTUAL_ENV=/tmp/budget uv pip install --no-cache --quiet dist/caravan_ml-*.whl
          ms=$(( $(date +%s%3N) - start ))
          bytes=$(du -sb /tmp/budget/lib | cut -f1)
          mib=$(( bytes / 1024 / 1024 ))
          printf 'cold install: %d.%03ds, %d MiB installed\n' $(( ms / 1000 )) $(( ms % 1000 )) "$mib"
          if [ "$ms" -gt 30000 ]; then echo "over the 30 second budget"; exit 1; fi
          if [ "$mib" -gt 50 ]; then echo "over the 50 MB budget"; exit 1; fi
