name: firmware

# The board guide's firmware (examples/lora32), built against the example's export, for both
# LoRa32 environments (feature 009, FR-009, research R6). It proves the exported C and the firmware
# compile for the ESP32; it does not run them — that is the owner's board run.
#
# When it runs:
#   - from the release workflow, before anything is published: a firmware that does not build
#     blocks the release;
#   - on pull requests that change what the firmware compiles. Deliberately not on a change to
#     docs/guides/lora32.md alone: a documentation-only change starts nothing (constitution,
#     Resources & Cost Discipline). The guide's blocks are checked here on the next code change and
#     on every release;
#   - by hand.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/caravan/export/**"
      - "src/caravan/stages/export.py"
      - "src/caravan/data/test_part.py"
      - "examples/lora32/**"
      - "examples/picket-mlp.yaml"
      - ".github/workflows/firmware.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # About 540 MB of toolchain, ESP-IDF and tools on a cold start (research R3).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/penv
            ~/.platformio/.cache
            ~/.cache/pip
          key: platformio-${{ hashFiles('examples/lora32/platformio.ini', 'examples/lora32/dependencies.lock') }}
      - name: Caravan and the example's export, as the try-it guide installs and runs them
        run: |
          python3.13 -m venv /tmp/env
          . /tmp/env/bin/activate
          pip install -e ".[train,verify]"
          caravan export examples/picket-mlp.yaml
      - name: the board guide's blocks, as written
        run: |
          . /tmp/env/bin/activate
          for step in board-tools board-copy board-build; do
            python -m tests.support_docs docs/guides/lora32.md "$step" > "/tmp/$step.sh"
          done
          start=$(date +%s)
          bash -euo pipefail -c '. /tmp/env/bin/activate; . /tmp/board-tools.sh; . /tmp/board-copy.sh; . /tmp/board-build.sh' | tee /tmp/build.log
          echo "lora32: $(( $(date +%s) - start ))s from installing PlatformIO to a built firmware" >> "$GITHUB_STEP_SUMMARY"
      - name: the V1.0 environment
        run: |
          . /tmp/env/bin/activate
          cd examples/lora32
          pio run -e lora32-v1 | tee /tmp/build-v1.log
      - name: the linker's figures (estimated, not measured on a board)
        run: |
          {
            echo '```'
            grep -E "RAM:|Flash:" /tmp/build.log | sed 's/^/lora32    /'
            grep -E "RAM:|Flash:" /tmp/build-v1.log | sed 's/^/lora32-v1 /'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
