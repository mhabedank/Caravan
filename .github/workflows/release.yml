name: release

# Two ways in, one sequence:
#   - a pushed tag v*;
#   - "Run workflow" on main with a version: the tag is created here, after the checks pass. A
#     session that cannot push tags can still release (feature 007, contracts/release.md).
# Then: check that the version is the package's, run the whole suite, tag (manual start only),
# build and check the built package, build the board guide's firmware (feature 009), publish a
# GitHub release with the wheel and the sdist, run part 1 of the tutorial literally against what was
# published, and publish the documentation site for the new tag.
#
# Nothing goes to the package index (owner decision, 2026-10-23), and no secret exists beyond this
# workflow's own token. A failure before `tag` creates nothing, a failure before `release`
# publishes nothing, and a tag is never moved.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag and release, without the v (e.g. 0.1.0rc1). Must equal pyproject.toml on main."
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv python install 3.13
      - name: the tag is the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "a release is started from main only, not from $GITHUB_REF"; exit 1
            fi
            version="${REQUESTED#v}"
            if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
              echo "tag v${version} exists already; a tag is never moved"; exit 1
            fi
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          module=$(grep -m1 '^__version__ = ' src/caravan/__init__.py | cut -d'"' -f2)
          echo "requested $version, pyproject $declared, module $module"
          if [ "$version" != "$declared" ] || [ "$version" != "$module" ]; then
            echo "the version does not match the package; nothing is tagged or published"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: the whole suite, both extras, from the tag
        run: |
          uv venv --python 3.13 /tmp/train
          VIRTUAL_ENV=/tmp/train uv pip install -e ".[train,verify]" pytest packaging
          VIRTUAL_ENV=/tmp/train /tmp/train/bin/python -m pytest tests -q
      - name: the documentation site builds, every warning an error (feature 009, FR-020)
        run: |
          uv sync --python 3.13 --group docs
          CARAVAN_VERSION="${{ steps.version.outputs.version }}" uv run sphinx-build -W -b html docs _site

  tag:
    # Only for a manual start: the tag on the commit that was just checked. Pushed with this
    # workflow's own token, which starts no further workflow, so this run carries on by itself.
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: create and push the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Caravan ${VERSION}"
          git push origin "$TAG"

  build:
    needs: [check, tag]
    # `tag` is skipped on a pushed tag; skipped is fine, failed is not.
    if: always() && needs.check.result == 'success' && needs.tag.result != 'failure' && needs.tag.result != 'cancelled'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv python install 3.13 3.14
      - run: uv build
      - name: the built package reports the tag's version
        run: |
          wheel="dist/caravan_ml-${VERSION}-py3-none-any.whl"
          test -f "$wheel"
          uv venv --python 3.13 /tmp/full
          VIRTUAL_ENV=/tmp/full uv pip install "caravan-ml[train,verify] @ ./$wheel"
          test "$(/tmp/full/bin/caravan --version)" = "caravan-ml ${VERSION}"
          uv venv --python 3.14 /tmp/core
          VIRTUAL_ENV=/tmp/core uv pip install "./$wheel"
          test "$(/tmp/core/bin/caravan --version)" = "caravan-ml ${VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  firmware:
    # The board guide's firmware must build before anything is published (feature 009, FR-009).
    needs: [check]
    uses: ./.github/workflows/firmware.yml

  release:
    needs: [check, build, firmware]
    if: always() && needs.build.result == 'success' && needs.firmware.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: publish the GitHub release
        run: |
          base="${VERSION%%rc*}"
          flags=()
          case "$VERSION" in *rc*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --verify-tag \
            --title "Caravan ${VERSION}" \
            --notes-file "docs/releases/${base}.md" \
            "${flags[@]}"

  verify:
    # A fresh runner, the guide as written, against the release just published (research R5).
    needs: [check, release]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: install, then tutorial part 1's fetch and run, in an empty directory
        run: |
          mkdir /tmp/try && cd /tmp/try
          # The install block is on the installation page; part 1 fetches and runs the example.
          python3.13 "$GITHUB_WORKSPACE/source/tests/support_docs.py" \
            "$GITHUB_WORKSPACE/source/docs/intro/install.md" install > /tmp/install.sh
          for step in fetch run; do
            python3.13 "$GITHUB_WORKSPACE/source/tests/support_docs.py" \
              "$GITHUB_WORKSPACE/source/docs/intro/tutorial01.md" "$step" > "/tmp/$step.sh"
          done
          start=$(date +%s)
          bash -euo pipefail -c '. /tmp/install.sh; . /tmp/fetch.sh; . /tmp/run.sh' | tee /tmp/guide.out
          elapsed=$(( $(date +%s) - start ))
          echo "tutorial part 1: ${elapsed}s from install to export" >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt 600 ]; then echo "over the 10 minutes of SC-001"; exit 1; fi
      - name: the README's first install line, as written, in a fresh environment
        run: |
          python3.13 -m venv /tmp/readme
          line=$(grep -m1 '^pip install "caravan-ml @ ' "$GITHUB_WORKSPACE/source/README.md")
          eval "/tmp/readme/bin/${line}"
          test "$(/tmp/readme/bin/caravan --version)" = "caravan-ml ${VERSION}"

  docs:
    # The site for the new tag, after the release exists (feature 009, research R2).
    needs: [check, release]
    if: always() && needs.release.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      tag: ${{ needs.check.outputs.tag }}
