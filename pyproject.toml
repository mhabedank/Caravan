[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "caravan-ml"
version = "0.1.0rc4"
description = "Declarative pipeline for small machine learning models on microcontrollers"
readme = "README.md"
# 3.13 rather than 3.14, and only because of the train extra: packaging has no per-extra Python
# window, and TensorFlow publishes no stable wheel above cp313 (2.21.0, checked 2026-10-22; 2.22.0rc0
# ships cp314 but depends on keras-nightly). Constitution v2.3.0, Principle XII, research R1 of
# feature 002. All three of 3.13, 3.14 and 3.15 are tested — a floor that is claimed and not tested
# is a false claim. This returns to ">=3.14" when a stable TensorFlow ships cp314 against a released
# keras; docs/ref/budgets.md carries the obligation.
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Martin Habedank" }]
keywords = ["tinyml", "microcontroller", "embedded", "machine-learning", "mobility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Embedded Systems",
]

# Two direct runtime dependencies, of the six the constitution allows (Principle XII).
# No upper bounds: one may be added only with a documented incompatibility (FR-031).
dependencies = [
  "pydantic>=2.9",
  "ruamel.yaml>=0.18",
]

# One of the four extras the constitution allows (Principle XII). Every dependency carries the
# marker, so installing the extra on 3.14 or 3.15 pulls no framework and the stage says why rather
# than the resolver failing. The upper bound on tensorflow is the documented-incompatibility case
# the constitution permits: 2.22's release candidate depends on keras-nightly, which a published
# distribution may not carry. It comes off when 2.22 ships final.
[project.optional-dependencies]
train = [
  "tensorflow>=2.21,<2.22; python_version < '3.14'",
  "keras>=3.12; python_version < '3.14'",
  "numpy>=1.26; python_version < '3.14'",
]

# The second of the four extras (Principle XII). It carries a Python marker like `train` does,
# for the same reason and with a wider window: ai-edge-litert 2.3.0 publishes cp310 through cp314
# and no cp315 (checked 2026-10-22 against the index, every recent version). So it covers the
# floor and the previous stable but not the current one, and the marker is what turns that into a
# sentence from caravan instead of a resolver error. The window closes when a cp315 wheel ships;
# docs/ref/budgets.md carries the obligation.
#
# What justifies it as an extra of its own is not the Python coverage but the weight: 114 MiB and
# 7 packages against `train`'s 1,971 and 41, with no training framework in its graph.
verify = ["ai-edge-litert>=2.3; python_version < '3.15'"]

[project.scripts]
caravan = "caravan.cli.main:main"

[project.urls]
Homepage = "https://github.com/mhabedank/Caravan"
Repository = "https://github.com/mhabedank/Caravan"

[dependency-groups]
# packaging is used by the dependency-budget test to parse requirement strings.
dev = ["pytest>=8.3", "ruff>=0.9", "packaging>=24.0"]
# The documentation site (feature 009, research R1): a build tool for docs/, never installed with the
# package and not an extra, so the dependency budget of Principle XII is unaffected. Pinned exactly,
# because the site's checks (-W) depend on the warnings these versions emit.
docs = ["sphinx==9.2.0", "myst-parser==5.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/caravan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
# Presence of the training framework is handled by importorskip in tests/train/conftest.py and
# needs no marker. Only the absence direction needs one, because a test that asserts the
# environment-incomplete path has to be skipped where the framework *is* installed.
markers = [
  "requires_no_train_extra: only runs where the training framework is absent",
  "requires_no_verify_extra: only runs where the model runtime is absent",
]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "tests", "docs/_ext"]
# The theme is CSS, HTML and fonts, so ruff never reaches it today. A guard for the day someone
# points ruff at the whole tree.
extend-exclude = ["docs/_themes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["caravan", "tests"]
