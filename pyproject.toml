[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "caravan-ml"
version = "0.1.0"
description = "Declarative pipeline for small machine learning models on microcontrollers"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Martin Habedank" }]
keywords = ["tinyml", "microcontroller", "embedded", "machine-learning", "mobility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Embedded Systems",
]

# Two direct runtime dependencies, of the six the constitution allows (Principle XII).
# No upper bounds: one may be added only with a documented incompatibility (FR-031).
dependencies = [
  "pydantic>=2.9",
  "ruamel.yaml>=0.18",
]

[project.scripts]
caravan = "caravan.cli.main:main"

[project.urls]
Homepage = "https://github.com/mhabedank/Caravan"
Repository = "https://github.com/mhabedank/Caravan"

[dependency-groups]
# packaging is used by the dependency-budget test to parse requirement strings.
dev = ["pytest>=8.3", "ruff>=0.9", "packaging>=24.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/caravan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["caravan", "tests"]
