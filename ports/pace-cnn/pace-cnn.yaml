# The zoo's pace-cnn 0.1.0 (IMU activity recognition on UCI HAR), rebuilt through Caravan as an
# internal test of the release candidate (feature 007). Nothing it produces is published.
#
# The data is what ports/pace-cnn/convert.py writes from the UCI HAR archive: the zoo's windows,
# its split by subject and its normalisation, checked against the zoo's hashes. Replace
# dataset.source with the directory you gave the converter; it must be outside this repository.
#
# Where this differs from the zoo's recipe, because Caravan 0.1.0 cannot express it (research R8):
# dropout 0.3 sits on the last block rather than after the pooling head; the learning rate is
# constant, without the zoo's cosine decay; convolutions keep their bias, which batch
# normalisation absorbs; calibration draws 500 training windows by seed rather than the first
# 500. The budget is the zoo's kill criterion K2.
apiVersion: caravan/v0.1

model:
  name: pace-cnn
  version: 0.1.0
  template: conv1d
  params:
    blocks:
      - {filters: 16, kernel: 5, padding: same, normalise: true, pool: 2}
      - {filters: 32, kernel: 5, padding: same, normalise: true, pool: 2}
      - {filters: 32, kernel: 3, padding: same, normalise: true, dropout: 0.3}
    head: average

inputs:
  - name: imu
    kind: series
    window: 128

outputs:
  - name: activity
    kind: class
    labels: [walking, walking_upstairs, walking_downstairs, sitting, standing, laying]
    accuracy_drop_max: 0.03

dataset:
  source: /path/to/converted/uci-har
  split:
    column: split
  representative_samples: 500

train:
  epochs: 20
  batch: 128
  optimizer: adam
  learning_rate: 0.002
  early_stopping: false
  seed: 0

export:
  quantization: int8
  formats: [flatbuffer, c_array]
  targets: [esp32]
