# Art direction of the Caravan website imagery: the house style SIEBDRUCK.
#
# COPIED, NOT SHARED. The style, the negative prompt and the file's shape come from the Mobility
# Model Zoo's `zoo/site/images/series/siebdruck.yaml`, copied on 2026-10-27. The constitution
# forbids depending on the zoo, so this is a copy for the same reason the design tokens are. The
# two may drift and nothing keeps them in step.
#
# WHAT CARAVAN CHANGED:
#   - The subjects are its own. The zoo's are mobility scenes — trains, trams, locks, viaducts.
#     Caravan has no vehicles to photograph; it has a route, loads that must get smaller, a gate
#     that refuses them, a workbench and a board. A picture here is about one of those.
#   - The accent sentence. The zoo reserves its warm ink for "the main vehicle or machine"; here it
#     is "the one object the picture is about", which is the same rule stated for a subject matter
#     that has no vehicles. It matches the site's own accent rule: reserved in the interface for
#     the budget and its verdict, and in an illustration for the subject of the picture.
#   - The negative prompt gained the clichés THIS subject attracts. A model asked for "machine
#     learning on a small device" reaches for glowing brains, circuit traces and server racks.
#     None of them is a thing Caravan does, and all of them are in `negative` below.
#   - No `palette` or `duplicate_max_bits` block. Those are the thresholds of the zoo's automatic
#     checks I6 and I7, and the checks are not ported (README.md says why). Carrying thresholds
#     that nothing reads would be a claim about this repository that is not true.
#
# Every image's prompt is one subject below followed by `style`.
name: siebdruck
style: >-
  1970s modernist poster illustration, flat colour fields with crisp edges, screen print texture,
  clean geometric forms, calm ordered composition with long diagonals, soft gradient sky in pale mint and warm cream,
  deep navy shadows and ground, the one object the picture is about painted in a warm orange-yellow accent colour,
  everything else only navy, mint and cream, early morning light as graphic shapes, quietly futurist and precise,
  West German graphic design of the seventies, restrained, no text, no lettering, no logos, no faces,
  people only as small simple silhouettes
negative: >-
  text, letters, words, numbers, watermark, logo, signature, face, portrait, photo, photorealistic,
  glossy, 3d render, neon, chrome, robot, spaceship, retro kitsch, cluttered, blurry,
  orange sky, orange ground, brain, glowing network, hologram, floating icons, circuit pattern,
  circuit board traces, server rack, data centre, binary digits, matrix rain, glowing cube,
  keyboard, laptop, smartphone, screen full of code
models:
  draft:
    id: black-forest-labs/FLUX.2-klein-4B
    pipeline: Flux2KleinPipeline
    licence: Apache-2.0
    card: https://huggingface.co/black-forest-labs/FLUX.2-klein-4B
    steps: 4
    guidance: 1.0
  final:
    id: Qwen/Qwen-Image-2512
    pipeline: QwenImagePipeline
    licence: Apache-2.0
    card: https://huggingface.co/Qwen/Qwen-Image-2512
    steps: 50
    true_cfg_scale: 4.0

# `placement` is a note, not a mechanism: nothing reads it, and no image is on the site until
# someone puts it there. It is here so the sheet can say what each subject is FOR, because a
# picture is easier to judge against the page it is meant for than on its own.
themes:

  # The journey the project is named after: a load that starts large and arrives small.
  route:
    - id: road-to-the-board
      aspect: "16:9"
      placement: the first screen
      prompt: a straight road running to the horizon across flat open country at dawn, three cargo cases travelling along it one behind the other, each one smaller than the one before, a tall orange-yellow instrument board standing at the roadside where the road ends
      scene: A road to the horizon with three cases travelling it, each smaller than the last, and an instrument board at the end
      alt: A road runs to the horizon across flat country; three cargo cases travel along it, each smaller than the one before, towards an orange-yellow instrument board standing at the roadside
    - id: setting-off
      aspect: "16:9"
      placement: the route index
      prompt: a loaded cart and two smaller trailers setting off from a walled yard onto an empty road at first light, the leading cart orange-yellow, long shadows across the gravel
      scene: A loaded cart and two trailers setting off from a yard at first light
      alt: An orange-yellow cart and two smaller trailers set off from a walled yard onto an empty road at first light
    - id: first-load
      placement: leg 1, your first model
      prompt: a single orange-yellow crate standing on a flat handcart beside a long table stacked with sheets of paper, a workshop lamp above, early light from a tall window
      scene: A crate on a handcart beside a long table of stacked paper
      alt: A single orange-yellow crate stands on a handcart beside a long table stacked with paper, under a workshop lamp
    - id: sorting-the-columns
      placement: leg 2, your own columns
      prompt: a long sorting table with five upright card trays standing side by side, two of the trays orange-yellow and the rest deep navy, a small silhouetted figure from behind reaching towards one
      scene: A sorting table with five card trays, two of them picked out
      alt: Five upright card trays stand side by side on a sorting table; two are orange-yellow and the rest navy, and a small figure reaches towards one
    - id: onto-the-bench
      placement: leg 3, onto a board
      prompt: an orange-yellow instrument board clamped upright in a bench vice on a wooden workbench, a single thin cable running off the edge of the bench, morning light across the grain
      scene: An instrument board clamped in a bench vice, one cable running off the bench
      alt: An orange-yellow instrument board is clamped upright in a bench vice on a workbench, with one thin cable running off the edge
    - id: the-load-that-will-not-fit
      placement: leg 4, when it does not fit
      prompt: a large deep navy crate halted in front of a narrow doorway that is plainly too small for it, the doorframe orange-yellow, a measuring rod leaning against the wall beside it
      scene: A crate halted in front of a doorway too small for it, a measuring rod beside it
      alt: A large navy crate stands halted before a narrow orange-yellow doorframe it is plainly too wide for, with a measuring rod leaning beside it

  # The budget and its verdict. Principle V: a budget is a gate, not a warning.
  gate:
    - id: the-barrier
      aspect: "16:9"
      placement: concepts, budgets and gates
      prompt: a level crossing barrier lowered across an empty road at dawn, the barrier orange-yellow, a loaded cart waiting behind it, flat fields running to the horizon
      scene: A lowered barrier across an empty road, a loaded cart waiting behind it
      alt: An orange-yellow barrier is lowered across an empty road at dawn while a loaded cart waits behind it
    - id: the-weighbridge
      placement: the budgets page
      prompt: a loaded cart standing on a weighbridge platform in a yard, the weighbridge dial orange-yellow on its post beside it, long morning shadows across the ground
      scene: A loaded cart on a weighbridge, its dial on a post beside it
      alt: A loaded cart stands on a weighbridge platform, with an orange-yellow dial on a post beside it
    - id: the-checkpoint
      placement: the rules reference
      prompt: a row of numbered inspection posts standing along the verge of a road, one of them orange-yellow, a clipboard hanging from it, flat country behind
      scene: A row of inspection posts along a road, one of them marked
      alt: A row of inspection posts stands along a road; one is orange-yellow and carries a clipboard
    - id: cleared
      aspect: "16:9"
      reserve: true
      placement: reserve — a passing verdict
      prompt: a raised level crossing barrier and a loaded cart moving away down an empty road, the barrier orange-yellow, wide flat country at dawn
      scene: A raised barrier and a cart moving away down the road
      alt: An orange-yellow barrier stands raised while a loaded cart moves away down an empty road

  # Where the work is done: the concepts and the reference.
  workshop:
    - id: the-template-rack
      placement: concepts, templates
      prompt: a tall rack of shallow drawers in a workshop, one drawer pulled open to show a single orange-yellow machine part lying in it, morning light from the left
      scene: A rack of shallow drawers, one open on a single part
      alt: A tall rack of shallow drawers with one drawer pulled open, an orange-yellow machine part lying inside
    - id: the-sorting-trays
      placement: concepts, feature types
      prompt: four shallow trays on a workbench holding four different kinds of small parts, one tray orange-yellow and the others navy, a pair of tweezers resting beside them
      scene: Four trays of different parts on a bench, one tray picked out
      alt: Four shallow trays of different small parts stand on a workbench; one tray is orange-yellow and a pair of tweezers rests beside them
    - id: the-logbook
      placement: concepts, what a run leaves
      prompt: an open logbook lying on a desk with ruled columns of handwriting, an orange-yellow stamp resting on the open page, a lamp and a steel rule beside it
      scene: An open logbook on a desk with a stamp resting on the page
      alt: An open logbook of ruled columns lies on a desk with an orange-yellow stamp resting on the page
    - id: the-callipers
      placement: the manifest reference
      prompt: a pair of callipers closed around a small orange-yellow block on a workbench, a long steel rule and a closed notebook beside them, clean morning light
      scene: Callipers closed around a small block on a workbench
      alt: A pair of callipers is closed around a small orange-yellow block on a workbench beside a steel rule and a notebook
    - id: the-control-panel
      placement: the CLI reference
      prompt: a flat workshop control panel with a row of plain labelled switches and one taller orange-yellow lever, deep navy casing, morning light raking across it
      scene: A workshop control panel with a row of switches and one lever
      alt: A navy workshop control panel carries a row of plain switches and one taller orange-yellow lever
    - id: the-amendment
      placement: manifest changes
      prompt: a drawing board with two technical drawings laid over each other, the upper sheet pinned back at one corner to show the one beneath, an orange-yellow pencil lying across them
      scene: Two technical drawings overlaid on a board, the upper one pinned back at a corner
      alt: Two technical drawings lie over each other on a drawing board, the upper sheet pinned back at one corner, with an orange-yellow pencil across them

  # Where the data comes from, and how far it has been taken.
  field:
    - id: the-sensor-post
      aspect: "16:9"
      placement: the data, wherever it is explained
      prompt: a slender instrument mast standing alone in flat open country at dawn, the instrument head at its top orange-yellow, a cable running down the mast and away into the grass
      scene: An instrument mast alone in flat country, a cable running down into the grass
      alt: A slender instrument mast stands alone in flat country at dawn with an orange-yellow instrument head and a cable running down into the grass
    - id: the-depot
      aspect: "16:9"
      placement: what is verified today
      prompt: a row of instrument boards standing upright in an open rack under a depot canopy, one of them orange-yellow and the rest deep navy, flat country visible beyond
      scene: A row of instrument boards in an open rack under a depot canopy
      alt: Instrument boards stand upright in an open rack under a depot canopy; one is orange-yellow and the rest are navy
    - id: the-route-map
      placement: the roadmap
      prompt: a route map unrolled on a table, the travelled part of the route drawn as a solid orange-yellow line and the rest as a faint dashed one, a plain weight holding one corner down
      scene: A route map unrolled on a table, part of the route solid and the rest dashed
      alt: A route map lies unrolled on a table; part of the route is drawn as a solid orange-yellow line and the rest as a faint dashed one
    - id: the-field-run
      placement: board runs
      prompt: an orange-yellow instrument board strapped to a weathered wooden post at the edge of a field, a thin cable running down the post, long dawn shadows across the grass
      scene: An instrument board strapped to a post at the edge of a field
      alt: An orange-yellow instrument board is strapped to a weathered wooden post at the edge of a field, with a thin cable running down it
