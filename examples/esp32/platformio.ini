; The route's firmware for a generic ESP32 development board (docs/route/3-onto-a-board.md).
;
; It runs the test windows of an exported model (model/test_windows.h) through the model on the
; board and prints, per window, the board's answer, the host's and the expected one, over the
; serial port. It is model-agnostic: everything model-specific comes from the four files the export
; writes into src/model/, so your own model needs no change here.
;
; `esp32dev` is the plain ESP32 DevKit profile and the widest-fitting target there is: any classic
; ESP32 board with 4 MB of flash builds and flashes with it. If yours differs — a different flash
; size, an ESP32-S3, a module without PSRAM — the route says which line to change.
;
; Pinned, so that what was verified is what you build:
;   platform espressif32 6.13.0  -> ESP-IDF 5.5.3, toolchain-xtensa-esp-elf 14.2.0
;   espressif/esp-tflite-micro 1.4.1 (src/idf_component.yml), resolved in dependencies.lock

[env:esp32dev]
platform = platformio/espressif32 @ 6.13.0
framework = espidf
board = esp32dev
monitor_speed = 115200
; The component version is repeated here for the run record; keep it equal to src/idf_component.yml.
build_flags =
    -DCARAVAN_FIRMWARE=\"examples/esp32\"
    -DCARAVAN_TFLM_COMPONENT=\"esp-tflite-micro\ 1.4.1\"
