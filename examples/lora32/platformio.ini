; The board guide's firmware for a LILYGO LoRa32 (docs/guides/lora32.md, feature 009).
;
; It runs the test windows of an exported model (model/test_windows.h) through the model on the
; board and shows, per window, the board's answer, the host's and the expected one: on the OLED and
; on the serial port. It is model-agnostic: everything model-specific comes from the four files the
; export writes into src/model/.
;
; Pinned, so that what was verified is what you build (research R3, checked 2026-10-26):
;   platform espressif32 6.13.0  -> ESP-IDF 5.5.3, toolchain-xtensa-esp-elf 14.2.0
;   espressif/esp-tflite-micro 1.4.1 (src/idf_component.yml), resolved in dependencies.lock
;
; Two environments, one per OLED wiring. Pick yours with -e (the guide says how to tell):
;   lora32     V1.3, V1.6, V2.0, V2.1 (T3 1.6 / 1.6.1): OLED on SDA 21 / SCL 22
;   lora32-v1  V1.0: OLED on SDA 4 / SCL 15, reset on 16

[platformio]
default_envs = lora32

[env]
platform = platformio/espressif32 @ 6.13.0
framework = espidf
board = ttgo-lora32-v21
monitor_speed = 115200
; The component version is repeated here for the run record; keep it equal to src/idf_component.yml.
build_flags =
    -DCARAVAN_FIRMWARE=\"examples/lora32\"
    -DCARAVAN_TFLM_COMPONENT=\"esp-tflite-micro\ 1.4.1\"

[env:lora32]

[env:lora32-v1]
build_flags =
    ${env.build_flags}
    -DCARAVAN_LORA32_V1
