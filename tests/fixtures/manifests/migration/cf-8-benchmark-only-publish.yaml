# A previous-form manifest that rule CF-8 used to refuse: benchmark-only data asked for publication.
# CF-8 was retired with the compliance layer (feature 006, Principle VI). Through migration it now
# loads, and the notice for dataset.permitted_use says that the author's own restriction is no
# longer enforced by Caravan. The expected notices are in the sibling .notices.json.
apiVersion: caravan/v0
model:
  name: pilot-min
  version: 0.0.1
  topic: automotive-security
  task: can-ids
  template: mlp
  params:
    hidden:
    - 8
dataset:
  source: datasets/example/
  window: 32
  labels:
  - normal
  - attack
  representative_samples: 100
  permitted_use: benchmark-only
export:
  targets:
  - stm32h743
compliance:
  eu_ai_act_class: minimal-risk
  privacy: no-personal-data
  intended_use: Example model used to exercise the schema end to end
  known_limits:
  - Not trained; exists to validate the manifest contract
publish:
  hf_repo: someone/some-model
