# A previous-form manifest that rule CF-7 used to refuse: an emulator named for boards without one.
# CF-7 was retired with the `verify` section, which returns with its stage (feature 006,
# Principle I). Through migration it now loads; the expected notices are in .notices.json.
apiVersion: caravan/v0
model:
  name: pilot-min
  version: 0.0.1
  topic: automotive-security
  task: can-ids
  template: mlp
  params:
    hidden:
    - 8
dataset:
  source: datasets/example/
  window: 32
  labels:
  - normal
  - attack
  representative_samples: 100
export:
  targets:
  - s32k144
compliance:
  eu_ai_act_class: minimal-risk
  privacy: no-personal-data
  intended_use: Example model used to exercise the schema end to end
  known_limits:
  - Not trained; exists to validate the manifest contract
verify:
  emulator: renode
