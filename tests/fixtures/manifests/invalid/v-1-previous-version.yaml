# Invalid on purpose. The form of features 006 and 007 (caravan/v0.1). Before Caravan 1.0.0 an
# older manifest is refused, never migrated or reinterpreted (constitution 4.0.0, Principle IX); the
# message names the implemented version and the change note says what to edit by hand.
# Expected: V-1 at apiVersion
apiVersion: caravan/v0.1

model:
  name: pilot-min
  version: 0.0.1
  template: mlp
  params:
    hidden: [8]

inputs:
  - name: frames
    kind: series
    window: 32

outputs:
  - name: verdict
    kind: class
    accuracy_drop_max: 0.02

dataset:
  source: datasets/example/
  representative_samples: 100

export:
  targets: [stm32h743]
