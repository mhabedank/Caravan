# Invalid on purpose. The template itself rejects the parameters: a hidden width of zero.
# Expected: T-2 at model.params.hidden
apiVersion: caravan/v0.1
model:
  name: pilot-min
  version: 0.0.1
  template: mlp
  params:
    hidden:
    - 0
inputs:
- name: frames
  kind: series
  window: 32
outputs:
- name: verdict
  kind: class
  accuracy_drop_max: 0.02
dataset:
  source: datasets/example/
  representative_samples: 100
export:
  targets:
  - stm32h743
