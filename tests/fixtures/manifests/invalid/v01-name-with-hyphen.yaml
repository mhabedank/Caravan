# Invalid on purpose. A hyphen in a declaration name: the name becomes a C identifier in the
# exported header, and a hyphen is not C.
# Expected: CF-9 at inputs[0].name
apiVersion: caravan/v0.1
model:
  name: pilot-min
  version: 0.0.1
  template: mlp
  params:
    hidden:
    - 8
inputs:
- name: can-frames
  kind: series
  window: 32
outputs:
- name: verdict
  kind: class
  accuracy_drop_max: 0.02
dataset:
  source: datasets/example/
  representative_samples: 100
export:
  targets:
  - stm32h743
