# Invalid on purpose. A split part is zero: no data to train on, tune on or measure against.
# Expected: CF-1 at dataset.split
apiVersion: caravan/v0
model:
  name: pilot-min
  version: 0.0.1
  topic: automotive-security
  task: can-ids
  template: mlp
  params:
    hidden:
    - 8
dataset:
  source: datasets/example/
  window: 32
  labels:
  - normal
  - attack
  representative_samples: 100
  split:
    train: 0.85
    val: 0.15
    test: 0.0
export:
  targets:
  - stm32h743
compliance:
  eu_ai_act_class: minimal-risk
  privacy: no-personal-data
  intended_use: Example model used to exercise the schema end to end
  known_limits:
  - Not trained; exists to validate the manifest contract
