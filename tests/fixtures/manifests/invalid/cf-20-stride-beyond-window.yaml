# Invalid on purpose. A stride larger than the window would leave rows that no window reads.
# Expected: CF-20 at preprocessing.window_stride
apiVersion: caravan/v0.3
model:
  name: pilot-min
  version: 0.0.1
  template: mlp
  params:
    hidden:
    - 8
input_features:
- name: reading
  type: number
output_features:
- name: verdict
  type: category
  accuracy_drop_max: 0.02
preprocessing:
  window_size: 32
  window_stride: 40
dataset: datasets/example/
export:
  representative_samples: 100
  targets:
  - stm32h743
