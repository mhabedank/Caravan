# Invalid on purpose. A hyphen in a feature name: the name becomes a C identifier in the
# exported header, and a hyphen is not C.
# Expected: CF-9 at input_features[0].name
apiVersion: caravan/v0.2
model:
  name: pilot-min
  version: 0.0.1
  template: mlp
  params:
    hidden:
    - 8
input_features:
- name: wheel-speed
  type: number
output_features:
- name: verdict
  type: category
  accuracy_drop_max: 0.02
preprocessing:
  window_size: 32
dataset: datasets/example/
export:
  representative_samples: 100
  targets:
  - stm32h743
