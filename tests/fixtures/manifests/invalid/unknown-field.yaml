# Invalid on purpose. An unknown field; not rule-numbered, so the file name uses a bare slug.
# Expected: no rule identifier at model.hiden
apiVersion: caravan/v0.1
model:
  name: pilot-min
  version: 0.0.1
  template: mlp
  params:
    hidden:
    - 8
  hiden:
  - 8
inputs:
- name: frames
  kind: series
  window: 32
outputs:
- name: verdict
  kind: class
  accuracy_drop_max: 0.02
dataset:
  source: datasets/example/
  representative_samples: 100
export:
  targets:
  - stm32h743
