# Invalid on purpose. The same board is named twice; duplicates are rejected, not de-duplicated.
# Expected: CF-2 at export.targets
apiVersion: caravan/v0.1
model:
  name: pilot-min
  version: 0.0.1
  template: mlp
  params:
    hidden:
    - 8
inputs:
- name: frames
  kind: series
  window: 32
outputs:
- name: verdict
  kind: class
  accuracy_drop_max: 0.02
dataset:
  source: datasets/example/
  representative_samples: 100
export:
  targets:
  - stm32h743
  - stm32h743
