# Invalid on purpose. An image input must be the only input of its model (feature 010).
# Expected: CF-19 at input_features[1]
apiVersion: caravan/v0.2
model:
  name: pilot-min
  version: 0.0.1
  template: conv2d
  params:
    blocks:
    - {filters: 4, kernel: 3}
input_features:
- name: image
  type: image
- name: reading
  type: number
output_features:
- name: verdict
  type: category
  accuracy_drop_max: 0.02
dataset: datasets/example/
export:
  representative_samples: 100
  targets:
  - stm32h743
