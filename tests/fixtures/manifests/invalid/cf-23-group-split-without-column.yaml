# Invalid on purpose. A group split that names no column to group by.
# Expected: CF-23 at preprocessing.split.column
apiVersion: caravan/v0.3
model:
  name: pilot-min
  version: 0.0.1
  template: mlp
  params:
    hidden:
    - 8
input_features:
- name: reading
  type: number
output_features:
- name: verdict
  type: category
  accuracy_drop_max: 0.02
preprocessing:
  window_size: 32
  split:
    type: group
dataset: datasets/example/
export:
  representative_samples: 100
  targets:
  - stm32h743
