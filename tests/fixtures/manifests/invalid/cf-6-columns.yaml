# Invalid on purpose. A conv2d kernel spans 4 columns of a plane that has 2 (feature 010).
# Expected: CF-6 at preprocessing.window_size
apiVersion: caravan/v0.2
model:
  name: pilot-min
  version: 0.0.1
  template: conv2d
  params:
    blocks:
    - {filters: 4, kernel: [3, 4]}
input_features:
- name: reading
  type: number
- name: other
  type: number
output_features:
- name: verdict
  type: category
  accuracy_drop_max: 0.02
preprocessing:
  window_size: 8
dataset: datasets/example/
export:
  representative_samples: 100
  targets:
  - stm32h743
