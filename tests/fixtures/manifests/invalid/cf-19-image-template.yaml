# Invalid on purpose. The mlp template does not take images (feature 010).
# Expected: CF-19 at model.template
apiVersion: caravan/v0.2
model:
  name: pilot-min
  version: 0.0.1
  template: mlp
  params:
    hidden: [8]
input_features:
- name: image
  type: image
output_features:
- name: verdict
  type: category
  accuracy_drop_max: 0.02
dataset: datasets/example/
export:
  representative_samples: 100
  targets:
  - stm32h743
