# Invalid on purpose. An input feature reads the output's column: the model would be trained on its
# own answer.
# Expected: CF-11 at input_features[1].name
apiVersion: caravan/v0.2
model:
  name: pilot-min
  version: 0.0.1
  template: mlp
  params:
    hidden:
    - 8
input_features:
- name: reading
  type: number
- name: verdict
  type: category
output_features:
- name: verdict
  type: category
  accuracy_drop_max: 0.02
preprocessing:
  window_size: 32
dataset: datasets/example/
export:
  representative_samples: 100
  targets:
  - stm32h743
