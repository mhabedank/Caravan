# Invalid on purpose. int8 quantization without enough calibration samples.
# Expected: CF-4 at dataset.representative_samples
apiVersion: caravan/v0.1
model:
  name: pilot-min
  version: 0.0.1
  template: mlp
  params:
    hidden:
    - 8
inputs:
- name: frames
  kind: series
  window: 32
outputs:
- name: verdict
  kind: class
  accuracy_drop_max: 0.02
dataset:
  source: datasets/example/
  representative_samples: 10
export:
  targets:
  - stm32h743
