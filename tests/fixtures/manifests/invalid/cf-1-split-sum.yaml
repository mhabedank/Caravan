# Invalid on purpose. The split parts do not sum to one.
# Expected: CF-1 at dataset.split
apiVersion: caravan/v0.1
model:
  name: pilot-min
  version: 0.0.1
  template: mlp
  params:
    hidden:
    - 8
inputs:
- name: frames
  kind: series
  window: 32
outputs:
- name: verdict
  kind: class
  accuracy_drop_max: 0.02
dataset:
  source: datasets/example/
  representative_samples: 100
  split:
    train: 0.9
    val: 0.15
    test: 0.15
export:
  targets:
  - stm32h743
