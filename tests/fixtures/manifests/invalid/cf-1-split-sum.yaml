# Invalid on purpose. The split parts do not sum to one.
# Expected: CF-1 at preprocessing.split.probabilities
apiVersion: caravan/v0.2
model:
  name: pilot-min
  version: 0.0.1
  template: mlp
  params:
    hidden:
    - 8
input_features:
- name: reading
  type: number
output_features:
- name: verdict
  type: category
  accuracy_drop_max: 0.02
preprocessing:
  window_size: 32
  split:
    probabilities: [0.9, 0.15, 0.15]
dataset: datasets/example/
export:
  representative_samples: 100
  targets:
  - stm32h743
