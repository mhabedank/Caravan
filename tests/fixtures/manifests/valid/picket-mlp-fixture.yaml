# The pilot manifest, with one field changed: dataset.source points at the committed synthetic
# fixture instead of the author's copy of the HCRL Car-Hacking data.
#
# It exists because the acceptance criterion of feature 002 is that *the pilot manifest* builds and
# trains end to end, and the pilot manifest's own source is a path on the author's machine. Nothing
# else is changed — not the template, not the window, not a training setting — so a run of this
# file exercises what a run of the real one would, on 5,184 synthetic records instead of millions
# of real ones.
#
# Keep this in step with picket-mlp.yaml. If the two drift apart, the acceptance test stops
# testing the thing it claims to test.
apiVersion: caravan/v0

model:
  name: picket-mlp
  version: 0.1.0
  topic: automotive-security
  task: can-ids
  template: mlp
  params:
    hidden: [32, 16]
    dropout: 0.1

dataset:
  source: ../../datasets/synthetic
  split:
    train: 0.7
    val: 0.15
    test: 0.15
    stratified: true
  window: 64
  labels: [normal, dos, fuzzy, replay]
  representative_samples: 500

train:
  epochs: 50
  batch: 256
  optimizer: adam
  early_stopping: true

export:
  quantization: int8
  formats: [flatbuffer, c_array]
  targets: [s32k144, stm32h743, esp32]
  accuracy_drop_max: 0.02

verify:
  emulator: none

bench:
  metrics: [latency_p50, ram_peak, flash]

publish:
  hf_repo: mhabedank/picket-mlp
  license: apache-2.0

compliance:
  eu_ai_act_class: limited-risk
  privacy: no-personal-data
  intended_use: "CAN bus intrusion detection on gateway and zonal ECUs"
  known_limits:
    - "Trained on the HCRL Car-Hacking dataset; behaviour on zero-day attacks is untested"
