# The pilot manifest, with one field changed: `dataset` points at the committed synthetic fixture
# instead of the author's copy of the HCRL Car-Hacking data. Keep it in step with picket-mlp.yaml.
#
# Everything the training part can say is left to it: the label order (by frequency, as in Ludwig),
# the vocabulary of can_id, the shift and scale of each number. can_id is a category, a code and not
# a magnitude; the other columns are numbers. Each feature is its own model input and brings its
# preprocessing into the model, so the int8 gate passes with derived labels (feature 008, SC-003).
apiVersion: caravan/v0.2

model:
  name: picket-mlp
  version: 0.2.0
  template: mlp
  params:
    hidden: [32, 16]
    dropout: 0.1

input_features:
  - name: can_id
    type: category
  - {name: dlc, type: number}
  - {name: b0, type: number}
  - {name: b1, type: number}
  - {name: b2, type: number}

output_features:
  - name: label
    type: category
    accuracy_drop_max: 0.02

preprocessing:
  window_size: 64
  split: {type: stratify, column: label, probabilities: [0.7, 0.15, 0.15]}

dataset: ../../datasets/synthetic

trainer: {epochs: 50, batch_size: 256, learning_rate: 0.001, early_stop: 5}
random_seed: 42

export:
  quantization: int8
  formats: [flatbuffer, c_array]
  targets: [s32k144, stm32h743, esp32]
  representative_samples: 500
