# The pilot manifest, as its author writes it for the real data.
#
# dataset.source is a path on the author's machine; picket-mlp-fixture.yaml is the same manifest
# pointed at the committed synthetic fixture, which is what the end-to-end tests run.
apiVersion: caravan/v0.1

model:
  name: picket-mlp
  version: 0.1.0
  template: mlp
  params:
    hidden: [32, 16]
    dropout: 0.1

inputs:
  - name: frames
    kind: series
    window: 64

outputs:
  - name: attack
    kind: class
    labels: [normal, dos, fuzzy, replay]
    accuracy_drop_max: 0.02

dataset:
  source: datasets/car-hacking/
  split:
    train: 0.7
    val: 0.15
    test: 0.15
    stratified: true
  representative_samples: 500

train:
  epochs: 50
  batch: 256
  optimizer: adam
  early_stopping: true

export:
  quantization: int8
  formats: [flatbuffer, c_array]
  targets: [s32k144, stm32h743, esp32]
