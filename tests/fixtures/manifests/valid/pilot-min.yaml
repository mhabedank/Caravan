# Everything optional left out. This must validate: a minimal manifest is sufficient (FR-014).
#
# window_size is present because the mlp template consumes one (CF-6), representative_samples
# because quantization defaults to int8 (CF-4), and accuracy_drop_max because a category output
# must state its budget (Principle V). The label order and every fitted value come from the
# training part at run time.
apiVersion: caravan/v0.2

model:
  name: pilot-min
  version: 0.0.1
  template: mlp
  params:
    hidden: [8]

input_features:
  - {name: reading, type: number}

output_features:
  - {name: verdict, type: category, accuracy_drop_max: 0.02}

preprocessing:
  window_size: 32

dataset: datasets/example/

export:
  targets: [stm32h743]
  representative_samples: 100
