# The convolutional template on the committed synthetic fixture.
#
# A sibling of picket-mlp-fixture.yaml with one section changed: the model's template and its
# parameters. Same data, same window, same labels, same training settings — so a comparison of the
# two files is a comparison of *templates* and not of datasets or of hyperparameters. The labels
# are pinned for the same reason as the mlp's (research R11 of feature 006).
#
# The blocks fit a 64-sample window: 64 to 30 after the first convolution (kernel 5, stride 2), 15
# after its pooling, 13 after the second convolution. Rule CF-6 checks that arithmetic before
# anything is built, so a window that cannot carry the configuration is refused at validation.
apiVersion: caravan/v0.1

model:
  name: picket-conv1d
  version: 0.1.0
  template: conv1d
  params:
    blocks:
      - {filters: 16, kernel: 5, stride: 2, normalise: true, pool: 2}
      - {filters: 32, kernel: 3, dropout: 0.1}
    head: average

inputs:
  - name: frames
    kind: series
    window: 64

outputs:
  - name: attack
    kind: class
    labels: [normal, dos, fuzzy, replay]
    accuracy_drop_max: 0.02

dataset:
  source: ../../datasets/synthetic
  split:
    train: 0.7
    val: 0.15
    test: 0.15
    stratified: true
  representative_samples: 500

train:
  epochs: 50
  batch: 256
  optimizer: adam
  early_stopping: true

export:
  quantization: int8
  formats: [flatbuffer, c_array]
  targets: [s32k144, stm32h743, esp32]
