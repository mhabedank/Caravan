# The convolutional template in the new form (caravan/v0.1), on the synthetic fixture.
#
# Mirrors picket-conv1d-fixture.yaml with the model section unchanged, so a comparison of the two
# files is a comparison of manifest forms and not of models. The blocks fit a 64-sample window: 64
# to 30 after the first convolution (kernel 5, stride 2), 15 after its pooling, 13 after the
# second convolution; rule CF-6 checks that arithmetic before anything is built.
apiVersion: caravan/v0.1

model:
  name: picket-conv1d
  version: 0.1.0
  template: conv1d
  params:
    blocks:
      - {filters: 16, kernel: 5, stride: 2, normalise: true, pool: 2}
      - {filters: 32, kernel: 3, dropout: 0.1}
    head: average

inputs:
  - name: frames
    kind: series
    window: 64

outputs:
  - name: attack
    kind: class
    accuracy_drop_max: 0.02

dataset:
  source: ../../datasets/synthetic
  split:
    train: 0.7
    val: 0.15
    test: 0.15
    stratified: true
  representative_samples: 500

train:
  epochs: 50
  batch: 256
  optimizer: adam
  early_stopping: true

export:
  quantization: int8
  formats: [flatbuffer, c_array]
  targets: [s32k144, stm32h743, esp32]
