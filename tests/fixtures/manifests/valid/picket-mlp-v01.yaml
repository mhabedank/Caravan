# The pilot in the new form (schema version caravan/v0.1, feature 006), on the synthetic fixture.
#
# Mirrors picket-mlp-fixture.yaml, which is the same model in the previous form and now loads
# through migration. The input columns are derived from the data (every column but `label`); what
# else is missing was removed because no stage read it. The budget is stated, not defaulted:
# Principle V requires every manifest to state it.
#
# The labels are pinned, in the previous form's order, and that is a measured decision rather than
# a habit. Derived, they sort to dos, fuzzy, normal, replay; the model trains to different weights,
# and on this fixture the int8 gate then fails — 0.75 trained, 0.50 quantized, 3 of 12 test windows
# (measured 2026-10-23). The cause is not the order but unscaled inputs: CAN identifiers in the
# hundreds and payload bytes share one int8 input scale, which feature 006 does not change (input
# scaling is proposal P5). Pinned, this model is the migrated pilot's, and passes as it always did.
# picket-mlp-v01-derived.yaml is the same manifest with the labels derived.
apiVersion: caravan/v0.1

model:
  name: picket-mlp
  version: 0.1.0
  template: mlp
  params:
    hidden: [32, 16]
    dropout: 0.1

inputs:
  - name: frames
    kind: series
    window: 64

outputs:
  - name: attack
    kind: class
    labels: [normal, dos, fuzzy, replay]
    accuracy_drop_max: 0.02

dataset:
  source: ../../datasets/synthetic
  split:
    train: 0.7
    val: 0.15
    test: 0.15
    stratified: true
  representative_samples: 500

train:
  epochs: 50
  batch: 256
  optimizer: adam
  early_stopping: true

export:
  quantization: int8
  formats: [flatbuffer, c_array]
  targets: [s32k144, stm32h743, esp32]
