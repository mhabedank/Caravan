# A valid manifest that the fit check stops before any training (rule F-1, feature 006).
#
# The pilot with a wider first hidden layer and the smallest board as its only target. A window of
# 64 records gives 64 x 8 = 512 inputs to the first dense layer (can_id's embedding of 4 and four
# numbers per step), so its kernel alone is 512 x 2048 = 1,048,576 weights — 1,048,576 bytes at
# int8 — against the s32k144's 512 KiB = 524,288 bytes of flash. A floor is a lower bound: no
# training can make this model fit that board, so none is started.
apiVersion: caravan/v0.2

model:
  name: too-big
  version: 0.0.1
  template: mlp
  params:
    hidden: [2048, 256]

input_features:
  - name: can_id
    type: category
  - {name: dlc, type: number}
  - {name: b0, type: number}
  - {name: b1, type: number}
  - {name: b2, type: number}

output_features:
  - name: label
    type: category
    accuracy_drop_max: 0.02

preprocessing:
  window_size: 64
  split: {type: stratify, column: label, probabilities: [0.7, 0.15, 0.15]}

dataset: ../../datasets/synthetic

trainer: {epochs: 50, batch_size: 256, learning_rate: 0.001, early_stop: 5}
random_seed: 42

export:
  quantization: int8
  formats: [flatbuffer, c_array]
  targets: [s32k144]
  representative_samples: 500
